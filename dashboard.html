<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqWTRvHB8KIPx0RM1s5mMnM1W_N06CILMBS9O-fe4L8Q&s=10" sizes="any">
<title>DASHBOARD OVERVIEW – CITIC Dicastal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="manager-dashboard.css" rel="stylesheet">
</head>
<body>
<canvas id="db-particles"></canvas>
<div class="wrap">
  <div style="display: none;" id="db-ticker"><div id="db-ticker-inner"></div></div>

  <div id="db-hud-header">
    <div>
      <div id="db-hud-title">
        DASHBOARD OVERVIEW
        <div class="db-live-badge"><span class="db-live-dot"></span> LIVE</div>
      </div>
      <div id="db-hud-sub">CITIC DICASTAL · SW CNC PRODUCTION LINE </div>
    </div>
    <div style="text-align:right">
      <div id="db-hud-clock"><span class="clock-val" id="db-clock-val">--:--:--</span></div>
      <div id="db-hud-meta" id="db-shift-meta">Waiting for data…</div>
    </div>
  </div>

  <div id="db-status-line"><span id="db-status-dot" class="online"></span><span id="db-status-text">Connecting to live data…</span></div>

  <div id="summaryCards"></div>

  <div id="db-mid-strip">
    <div id="db-eff-panel">
      <div id="db-eff-panel-label">EFFICIENCY %</div>
      <svg id="db-eff-svg" width="110" height="110" viewBox="0 0 96 96">
        <circle class="db-eff-ring-track" id="db-eff-ring-track" cx="48" cy="48" r="40"/>
        <g id="db-tick-marks"></g>
        <circle id="db-eff-ring-fill" cx="48" cy="48" r="40"/>
        <text id="db-eff-ring-text" x="48" y="44" text-anchor="middle" dominant-baseline="central"
          style="font-size:17px;font-weight:900;font-family:'Orbitron',sans-serif;fill:#00d4ff">0%</text>
        <text x="48" y="61" text-anchor="middle"
          style="font-size:6px;font-family:'JetBrains Mono',monospace;fill:#4a7a9b;letter-spacing:2px">OEE</text>
      </svg>
      <div id="db-eff-panel-sub">— — —</div>
    </div>
    <div id="db-machine-grid-wrap">
      <div id="db-machine-grid-title">MACHINE STATUS</div>
      <div id="db-machine-grid"></div>
    </div>
  </div>

  <div class="db-charts-grid">
    <div class="db-chart-box"><div class="db-chart-title">ACTUAL vs TARGET — ALL MACHINES</div>
      <div class="db-chart-container"><canvas id="barChart"></canvas></div></div>
    <div class="db-chart-box"><div class="db-chart-title">EFFICIENCY % BY MACHINE</div>
      <div class="db-chart-container"><canvas id="effChart"></canvas></div></div>
    <div class="db-chart-box"><div class="db-chart-title">CUMULATIVE PRODUCTION TREND</div>
      <div class="db-chart-container"><canvas id="lineChart"></canvas></div></div>
    <div class="db-chart-box"><div class="db-chart-title">TOP 5 MACHINES BY OUTPUT</div>
      <div class="db-chart-container"><canvas id="topChart"></canvas></div></div>
  </div>
</div>

<script type="module" src="firebase-readonly.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
